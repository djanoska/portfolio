<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dávid Jánoszka | Coming Soon</title>
  <style>
    /* Reset margins and lock dark background matching the image */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #111111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Responsive image scaling without distortion */
    img {
      max-width: 100%;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Make sure the filename and extension match your uploaded image -->
  <img src="coming-soon.jpg" alt="My portfolio is coming soon">
</body>
</html>
